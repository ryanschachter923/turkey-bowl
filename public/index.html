<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c111d">
<title>Turkey Bowl 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='28' ry='17' transform='rotate(-35 32 32)' fill='%23F28C28'/%3E%3Cpath d='M24 40 40 24M27 33l4 4M31 29l4 4M35 25l4 4' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b101b;--panel:#131a29;--panel2:#1a2336;--line:#27324a;--text:#eaf0f8;--muted:#93a1b8;--accent:#f28c28;--gold:#f5b83d;--green:#3ccf7f;--red:#f06464;--a:#F28C28;--b:#2EC4B6;
--display:"Bahnschrift","DIN Alternate","DIN Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 85% -10%,rgba(242,140,40,.13),transparent 60%),radial-gradient(900px 400px at -10% 0%,rgba(46,196,182,.08),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,27,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.stripe{height:4px;background:linear-gradient(90deg,#8b4513,#f28c28,#f5b83d,#c0392b,#8b4513)}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:22px;text-transform:uppercase}
.brand small{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.brand .yr{color:var(--accent)}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--gold);color:var(--gold)}
nav.tabs{max-width:1180px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);padding:9px 14px 11px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:rgba(245,184,61,.1);border:1px solid rgba(245,184,61,.35);color:#f8d98a;font-size:14px}
.banner.err{background:rgba(240,100,100,.1);border-color:rgba(240,100,100,.4);color:#ffb3b3}
h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.sec .sub{font-family:system-ui;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:400}
h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;transition:transform .05s,border-color .15s}
.btn:hover{border-color:#41506f}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b0e02}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1e1300}
.btn.danger{border-color:rgba(240,100,100,.5);color:#ff9d9d}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
input[type=text],input[type=number],input[type=password],input:not([type]),select,textarea{background:#0e1422;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(242,140,40,.5);outline-offset:0;border-color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
/* player card */
.pc{position:relative;border-radius:16px;padding:12px 12px 10px;cursor:pointer;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);transition:transform .12s;text-align:left;width:100%}
.pc:hover{transform:translateY(-2px)}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);pointer-events:none}
.pc.elite{background:linear-gradient(160deg,#3a2808,#120d06 55%,#4a330a);color:#f9dc86;border-color:#8a6a22}
.pc.gold{background:linear-gradient(160deg,#ffe594,#e3ab3d 55%,#b8761b);color:#2b1a00}
.pc.silver{background:linear-gradient(160deg,#f3f6fa,#bdc6d1 60%,#8d98a6);color:#141922}
.pc.bronze{background:linear-gradient(160deg,#f2c697,#c8834a 60%,#8e5428);color:#2b1405}
.pc .top{display:flex;align-items:flex-start;gap:8px}
.pc .ovr{font-family:var(--display);font-weight:800;font-size:38px;line-height:.9}
.pc .ovr small{display:block;font-size:11px;letter-spacing:.14em;opacity:.8;margin-top:3px}
.pc .pos{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;margin-top:2px}
.pc .num{margin-left:auto;font-family:var(--display);font-weight:800;font-size:20px;opacity:.85}
.pc .av{width:62px;height:62px;border-radius:50%;margin:6px auto 6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;color:#fff;background:var(--tc,#2a3550);border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.pc .nm{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:19px;text-align:center;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .tm{font-size:11px;text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;min-height:16px;margin-top:2px}
.pc .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;margin-top:8px;padding-top:8px;border-top:1px solid currentColor;border-top-color:rgba(0,0,0,.18)}
.pc.elite .attrs{border-top-color:rgba(249,220,134,.3)}
.pc .at{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.pc .at span:first-child{opacity:.7;font-weight:600}
.pc .at .hi{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.pc .foot{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;font-weight:700;opacity:.85;gap:6px}
.pc .foot span:first-child{white-space:nowrap;flex:none}.pc .foot span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbadge{position:absolute;top:44px;right:10px;width:22px;height:22px;border-radius:50%;background:#111;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:13px;border:2px solid var(--gold)}
/* playbook */
.pbctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:2px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--text);color:var(--bg)}
.pbkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 14px}
.pbkey i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.pbkey i.dash{background:repeating-linear-gradient(90deg,#d9dee7 0 4px,transparent 4px 7px)!important}
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pbcard{background:#16191e;border:1px solid #262b33;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.pbcard:hover{transform:translateY(-2px);border-color:#3b4558}
.pbcard.flat{cursor:default}.pbcard.flat:hover{transform:none;border-color:#262b33}
.pbart svg{display:block;width:100%;height:auto}
.pbbar{background:#1c1f25;border-top:4px solid #E8402F;padding:9px 10px;text-align:center;font-size:17px;font-weight:500;color:#f3f5f8}
.pbmeta{display:flex;gap:8px;align-items:center;padding:0 10px 10px;background:#1c1f25;font-size:12px;min-width:0}
.pbform{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbcat{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:system-ui,sans-serif}
.pbcat.short{background:#163a29;color:#4ade80}.pbcat.medium{background:#3b3113;color:#facc15}.pbcat.long{background:#401b1f;color:#f87171}.pbcat.zone{background:#14284a;color:#60a5fa}
.pbtag{font-size:10.5px;font-weight:700;color:#9fb0c8;border:1px solid #33405a;border-radius:999px;padding:1px 7px;white-space:nowrap}
.pbdetail{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.pbdetail{grid-template-columns:1fr}}
.pblist{margin:8px 0 0;padding-left:18px;font-size:14px}.pblist li{margin:4px 0}
.pbnote{margin-top:12px;padding:9px 11px;border-radius:10px;background:#13233f;border:1px solid #274472;font-size:13px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(860px,100%);padding:18px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.narrow{width:min(440px,100%)}
.xbtn{position:absolute;top:10px;right:10px;border:0;background:var(--panel2);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.mgrid{display:grid;grid-template-columns:230px 1fr;gap:18px}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}.mgrid .pc{max-width:240px;margin:0 auto}}
.bar{height:8px;border-radius:5px;background:#0d1320;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.attrrow{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:640px){.comps{grid-template-columns:1fr}}
.comp{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2)}
.comp b{display:block;font-family:var(--display);letter-spacing:.04em;font-size:17px;margin:2px 0 4px}
.comp .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.comp.worst .lbl{color:var(--red)}.comp.base .lbl{color:var(--gold)}.comp.best .lbl{color:var(--green)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.form label,.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
/* draft */
.clock{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(242,140,40,.18),rgba(242,140,40,.04));border:1px solid rgba(242,140,40,.45)}
.clock .big{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.05em}
.teams2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.teams2{grid-template-columns:1fr}}
.tpanel{border-radius:14px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.thead{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,transparent),transparent)}
.thead .tn{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--tc);display:inline-block;flex:none}
.rlist{list-style:none;margin:0;padding:6px 0}
.rlist li{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.rlist li:last-child{border-bottom:0}
.posb{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:#0d1320;border:1px solid var(--line);min-width:34px;text-align:center}
.ovrb{font-family:var(--display);font-weight:800;font-size:18px;min-width:30px;text-align:right}
.ratings3{display:flex;gap:18px;padding:12px 14px;border-top:1px solid var(--line)}
.ratings3 div{text-align:center}.ratings3 b{display:block;font-family:var(--display);font-size:28px;line-height:1}.ratings3 span{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.picks{list-style:none;padding:0;margin:0;counter-reset:pk}
.picks li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.tape{display:grid;grid-template-columns:40px 1fr 54px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.tape .l{direction:rtl}
/* book */
.odds{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:stretch}
.odds .h{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:4px 0}
.odds .tname{display:flex;align-items:center;gap:8px;font-weight:700}
.ob{border:1px solid var(--line);background:#0e1524;border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:14px;line-height:1.15}
.ob small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.ob:hover{border-color:var(--accent)}
.ob.sel{background:var(--accent);border-color:var(--accent);color:#1b0e02}.ob.sel small{color:#3b2006}
.ob[disabled]{opacity:.45;cursor:not-allowed}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.prow{display:grid;grid-template-columns:1fr 92px 92px;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.money b{display:block;font-family:var(--display);font-size:24px}
.money span{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}
.slip{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;width:min(560px,calc(100% - 20px));background:#1b2438;border:1px solid var(--accent);border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.st{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.st.won{color:var(--green);border-color:rgba(60,207,127,.5)}.st.lost{color:var(--red);border-color:rgba(240,100,100,.5)}.st.open{color:var(--gold);border-color:rgba(245,184,61,.5)}.st.push,.st.void{color:var(--muted)}
.scroll-x{overflow-x:auto}
table.box th,table.box td{padding:6px 5px;font-size:13px}table.box th{font-size:10px;line-height:1.2;vertical-align:bottom}table.box td:first-child{white-space:nowrap}
/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:18px;border-radius:16px;background:#070b13;border:1px solid var(--line)}
.sb .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sb .nm{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.sb .pts{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(245,184,61,.35);font-variant-numeric:tabular-nums}
.sb .mid{text-align:center}
.live{color:var(--red);font-weight:800;letter-spacing:.12em;font-size:12px}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;background:#22304a;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw}
.toast.err{border-color:var(--red);color:#ffc0c0}
.toast.ok{border-color:var(--green)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.kbd{font-family:ui-monospace,monospace;background:#0d1320;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.hide{display:none!important}
.rules{columns:330px;column-gap:14px}.rules .panel{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid}.rules h3{color:var(--gold)}.rules ul{margin:0;padding-left:18px}.rules li{margin:6px 0}.rules li::marker{color:var(--accent)}.rules b{color:#fff}
</style>
</head>

<header>
  <div class="stripe"></div>
  <div class="hbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="28" ry="17" transform="rotate(-35 32 32)" fill="#F28C28"/><path d="M24 40 40 24M27 33l4 4M31 29l4 4M35 25l4 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <div>Turkey Bowl <span class="yr" id="yr">'26</span><small>Draft · Book · Box score</small></div>

    <div class="hright" id="hright"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="wrap" id="app"><div class="empty" style="margin-top:30px">Loading…</div></main>
<div id="modal-root"></div><div id="slip-root"></div><div id="toast-root"></div>
<script>window.TB_DEMO = false;</script>

<script>// Turkey Bowl core: shared by the browser app and the Netlify Function.
const Core = (() => {
  const ATTRS = ['SPD', 'ACC', 'AGI', 'PWR', 'CTH', 'RTE', 'THP', 'THA', 'COV'];
  const ATTR_NAMES = { SPD: 'Speed', ACC: 'Acceleration', AGI: 'Agility', PWR: 'Power', CTH: 'Catching', RTE: 'Route running', THP: 'Throw power', THA: 'Throw accuracy', COV: 'Coverage' };
  const POSITIONS = ['QB', 'WR', 'TE'];
  // Madden-style: each position weights the ratings differently, then the result is stretched around 70.
  const WEIGHTS = {
    QB: { THA: 0.40, THP: 0.25, SPD: 0.10, AGI: 0.10, ACC: 0.07, PWR: 0.05, CTH: 0.03 },
    WR: { CTH: 0.24, SPD: 0.22, RTE: 0.22, ACC: 0.12, AGI: 0.12, PWR: 0.08 },
    TE: { CTH: 0.28, PWR: 0.22, RTE: 0.18, SPD: 0.14, ACC: 0.09, AGI: 0.09 },
  };
  const DEF_WEIGHTS = { COV: 0.45, SPD: 0.18, AGI: 0.15, ACC: 0.12, PWR: 0.10 };
  const STRETCH = 1.5, PIVOT = 70;
  const STATS = {
    passTD: 'Pass TDs', comp: 'Completions', intThrown: 'INTs thrown', rec: 'Receptions', recTD: 'Rec TDs',
    rushTD: 'Rush TDs', totalTD: 'Total TDs', defINT: 'Def INTs', sacks: 'Sacks', pat: 'PATs made',
  };
  const EVENTS = {

        return ok({ bettor: { id, name, playerId: pid } });
      }
      if (path === '/login') {
        const id = slug(body.name || ''); const b = id && (await store.get('bettors/' + id, { type: 'json' }));
        if (!b || !(await checkPin(body.pin, b.pin))) return err('Name or PIN is wrong', 403);
        return json({ ok: true, bettor: { id: b.id, name: b.name, playerId: b.playerId || null } });
      }
      if (path === '/bet') {
        const b = await store.get('bettors/' + slug(body.bettorId || ''), { type: 'json' });
        if (!b || !(await checkPin(body.pin, b.pin))) return err('Log in again', 403);
        const snap = await readSnap(store); const g = snap.game || {};
        if (!g.linesPosted) return err('Lines are not posted yet'); if (g.betsLocked || g.status !== 'pre') return err('Betting is locked');
        const qt = quote(snap.config, body.market, body.sel, body.propId); if (typeof qt === 'string') return err(qt);
        if (Number(body.odds) !== qt.odds || (qt.line !== null && Number(body.line) !== qt.line)) return err('The line moved. Check the new number and try again.', 409);
        if (body.market === 'prop' && body.sel === 'under' && b.playerId && b.playerId === qt.playerId) return err("You can't bet the under on your own props");
        const stake = round(Number(body.stake), 2); if (!(stake >= 1)) return err('Minimum bet is $1');
        const L = ledger(snap)[b.id] || { available: snap.config.settings?.bankroll ?? 100 };
        if (stake > L.available + 1e-9) return err('Not enough in your bankroll');
        const id = rid(10); const ts = Date.now();
        const bet = { id, ts, bettorId: b.id, market: body.market, sel: body.sel, line: qt.line, odds: qt.odds, stake, propId: qt.propId || null, playerId: qt.playerId || null, stat: qt.stat || null };
        await store.setJSON('bets/' + id, bet, { onlyIfNew: true }); return ok({ bet });
      }
      if (path === '/bet/void') {
        const e = await requireCommish(store, body.pin); if (e) return err(e, 403);
        await store.setJSON('voids/' + body.betId, { betId: body.betId, ts: Date.now() }); return ok();
      }
      if (path === '/reset') {
        const e = await requireCommish(store, body.pin); if (e) return err(e, 403);
        const what = body.what;
        const wipe = async (prefix) => { const { blobs } = await store.list({ prefix }); for (const x of blobs) await store.delete(x.key); };
        if (what === 'game') { await wipe('events/'); await store.setJSON('game', { status: 'pre', linesPosted: false, betsLocked: false }); }
        else if (what === 'book') { await wipe('bets/'); await wipe('voids/'); await wipe('bettors/'); }
        else return err('Unknown reset');
        return ok();
      }
      return err('Not found', 404);
    } catch (e) {
      return err(e?.message || 'Server error', 500);
    }
  }

  return {
    ATTRS, ATTR_NAMES, POSITIONS, WEIGHTS, DEF_WEIGHTS, STATS, EVENTS, QUARTERS, qLabel, STRETCH, PIVOT,
    ovr, def, tier, rosters, teamOf, player, teamName, teamQB, nextPickTeam, draftable, teamRatings, other,
    profit, fmtOdds, probToOdds, projection, suggestLines, computeStats, settle, ledger, describe, quote,
    seedConfig, slug, round, handle,
  };
})();
