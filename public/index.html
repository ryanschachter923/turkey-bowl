    const views = { players: renderPlayers, draft: renderDraft, teams: renderTeams, plays: renderPlays, rules: renderRules, book: renderBook, score: renderScore };
    $('#app').innerHTML = (S.offline ? '<div class="banner err">Connection lost. Showing the last update; retrying…</div>' : '') + (window.TB_DEMO ? '<div class="banner">Demo mode: everything saves on this device only. Deploy to Netlify for the shared version.</div>' : '') + (views[S.tab] || renderPlayers)();
    renderSlip();
  }
  function renderHeader() {
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${l}</button>`).join('');
    const y = cfg()?.settings?.year; if (y) $('#yr').textContent = "'" + String(y).slice(-2);
    const me = S.me && ledger[S.me.id];
    $('#hright').innerHTML = (me ? `<button class="chip" data-act="tab" data-tab="book">${esc(me.name)} · <b>${money(me.available)}</b></button>` : '') +
      (isCommish() ? `<button class="chip on" data-act="commish-menu">Commish</button>` : `<button class="chip" data-act="commish">${S.hasCommish ? 'Commish' : 'Set commish PIN'}</button>`);
  }

  function card(p, o = {}) {
    const c = cfg(); const ov = C.ovr(p); const t = C.teamOf(c, p.id); const cap = t && c.teams[t].captainId === p.id;
    const attrs = C.ATTRS.map((a) => `<div class="at"><span>${a}</span><span class="${p.ratings[a] >= 90 ? 'hi' : ''}">${p.ratings[a]}</span></div>`).join('');
    const base = p.comps?.base?.name;
    return `<div class="pc ${C.tier(ov)}" role="button" tabindex="0" data-act="${o.act || 'open-player'}" data-id="${esc(p.id)}" style="--tc:${t ? tcol(t) : '#2a3550'}">
      <div class="top"><div class="ovr">${ov}<small>OVR</small></div><div class="pos">${esc(p.pos || '—')}</div><div class="num">${p.num !== '' && p.num != null ? '#' + esc(p.num) : ''}</div></div>
      ${cap ? '<div class="cbadge" title="Captain">C</div>' : ''}
      <div class="av">${esc(initials(p.name))}</div>
      <div class="nm">${esc(p.name)}</div>
      <div class="tm">${t ? esc(tname(t)) + (cap ? ' · Captain' : '') : 'Undrafted'}</div>
      <div class="attrs">${attrs}</div>
      <div class="foot"><span>DEF ${C.def(p)}</span><span>${base ? 'Comp: ' + esc(base) : ''}</span></div>
    </div>`;
  }

  // ----- players -----
  function renderPlayers() {
    const c = cfg(); const R = C.rosters(c); const onTeam = new Set([...R.A, ...R.B]);
    let ps = c.players.filter((p) => S.filter === 'All' || (S.filter === 'Undrafted' ? !onTeam.has(p.id) : p.pos === S.filter));
    const key = S.sort;
    ps.sort((a, b) => key === 'name' ? a.name.localeCompare(b.name) : key === 'ovr' ? C.ovr(b) - C.ovr(a) : key === 'def' ? C.def(b) - C.def(a) : (b.ratings[key] || 0) - (a.ratings[key] || 0));
    const qbs = c.players.filter((p) => p.pos === 'QB').length; const nopos = c.players.filter((p) => !p.pos).length;
    let warn = '';
    if (isCommish() && (qbs !== 2 || nopos)) warn = `<div class="banner">${nopos ? nopos + ' player' + (nopos > 1 ? 's' : '') + ' still need a position. ' : ''}${qbs !== 2 ? 'There ' + (qbs === 1 ? 'is 1 QB' : 'are ' + qbs + ' QBs') + '; each team needs exactly one.' : ''}</div>`;
    const capSel = (t) => `<label class="fl">${t === 'A' ? 'Team 1' : 'Team 2'} captain<select data-change="captain" data-team="${t}"><option value="">Not set</option>${c.players.map((p) => `<option value="${esc(p.id)}" ${c.teams[t].captainId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>`;
    return `${warn}
      ${isCommish() ? `<div class="panel" style="margin-top:14px"><div class="row" style="align-items:flex-end">${capSel('A')}${capSel('B')}<span class="grow"></span><button class="btn sm" data-act="add-player">Add player</button></div><div class="tiny muted" style="margin-top:8px">Captains start on their team and don't get drafted. Tap any card to edit position, number, ratings and comps.</div></div>` : ''}
      <h2 class="sec">Players <span class="sub">Tap a card for full ratings and NFL comps</span></h2>
      <div class="row" style="margin-bottom:14px">
        <div class="pills">${['All', 'QB', 'WR', 'TE', 'Undrafted'].map((f) => `<button class="pill ${S.filter === f ? 'on' : ''}" data-act="filter" data-f="${f}">${f}</button>`).join('')}</div>
        <span class="grow"></span>
        <label class="small muted">Sort <select data-change="sort">${[['ovr', 'OVR'], ['def', 'DEF'], ...C.ATTRS.map((a) => [a, a]), ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${S.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      ${ps.length ? `<div class="grid">${ps.map((p) => card(p)).join('')}</div>` : '<div class="empty">No players match.</div>'}`;
  }

  function playerModal(id, edit) {
    const c = cfg(); const p = C.player(c, id); if (!p) return;
    const w = C.WEIGHTS[p.pos];
    const fmla = w ? Object.entries(w).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${Math.round(v * 100)}% ${k}`).join(', ') : 'Set a position to use the position formula';
    const barColor = (v) => (v >= 85 ? 'var(--green)' : v >= 75 ? 'var(--gold)' : v >= 65 ? 'var(--accent)' : 'var(--red)');
    let body;
    if (!edit) {
      const comp = (k, l) => { const x = p.comps?.[k] || {}; return `<div class="comp ${k}"><div class="lbl">${l}</div><b>${esc(x.name || 'TBD')}</b><div class="small muted">${esc(x.note || '')}</div></div>`; };
      body = `<div class="mgrid"><div>${card(p, { act: 'noop' })}</div><div>
        <h3 style="font-size:22px;margin-bottom:2px">${esc(p.name)}</h3>
        <div class="muted small">${esc(p.pos || 'No position')} ${p.num !== '' ? '· #' + esc(p.num) : ''} · OVR ${C.ovr(p)}${p.ovrOverride ? ' (set by commish)' : ''} · DEF ${C.def(p)}</div>
        <div style="margin-top:10px">${C.ATTRS.map((a) => `<div class="attrrow"><span>${C.ATTR_NAMES[a]} <span class="muted tiny">${a}</span></span><div class="bar"><i style="width:${p.ratings[a]}%;background:${barColor(p.ratings[a])}"></i></div><b>${p.ratings[a]}</b></div>`).join('')}</div>
        <div class="tiny muted" style="margin-top:6px">OVR (Madden-style): ${esc(fmla)}, then stretched ${C.STRETCH}× around ${C.PIVOT}. DEF: 45% COV, 18% SPD, 15% AGI, 12% ACC, 10% PWR.</div>
        <h3 style="margin-top:14px">NFL comps</h3>
        <div class="comps">${comp('worst', 'Worst case')}${comp('base', 'Base case')}${comp('best', 'Best case')}</div>
        ${isCommish() ? `<div class="row" style="margin-top:14px"><button class="btn" data-act="edit-player" data-id="${esc(p.id)}">Edit player</button></div>` : ''}
      </div></div>`;
    } else {
      const compF = (k, l) => `<div class="comp ${k}"><div class="lbl">${l}</div><input data-f="comp-${k}-name" value="${esc(p.comps?.[k]?.name || '')}" placeholder="NFL player" style="width:100%;margin:6px 0"><textarea data-f="comp-${k}-note" rows="2" placeholder="Why (roast welcome)" style="width:100%">${esc(p.comps?.[k]?.note || '')}</textarea></div>`;
      body = `<h3 style="font-size:20px">Edit ${esc(p.name)}</h3>
        <div class="form" style="margin-top:10px">
          <label>Name<input data-f="name" value="${esc(p.name)}"></label>
          <label>Jersey #<input data-f="num" value="${esc(p.num ?? '')}" inputmode="numeric"></label>
          <label>Position<select data-f="pos"><option value="">—</option>${C.POSITIONS.map((x) => `<option ${p.pos === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
          <label>OVR override<input data-f="ovr" type="number" min="1" max="99" value="${p.ovrOverride || ''}" placeholder="Auto: ${C.ovr({ ...p, ovrOverride: null })}"></label>
        </div>
        <div class="form" style="margin-top:10px">${C.ATTRS.map((a) => `<label>${C.ATTR_NAMES[a]}<input data-f="r-${a}" type="number" min="1" max="99" value="${p.ratings[a]}"></label>`).join('')}</div>
        <h3 style="margin-top:14px">NFL comps</h3>
        <div class="comps">${compF('worst', 'Worst case')}${compF('base', 'Base case')}${compF('best', 'Best case')}</div>
        <div class="row" style="margin-top:14px"><button class="btn pri" data-act="save-player" data-id="${esc(p.id)}">Save</button><button class="btn ghost" data-act="open-player" data-id="${esc(p.id)}">Cancel</button><span class="grow"></span><button class="btn danger sm" data-act="delete-player" data-id="${esc(p.id)}">Remove player</button></div>`;
    }
    openModal(body);
  }

  // ----- playbook (plays and coverages come from src/plays.js) -----
  const pbSeg = (act, cur, opts, extra = '') => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(cur) === String(v) ? 'on' : ''}" data-act="${act}" data-v="${v}"${extra}>${l}</button>`).join('')}</div>`;
  const pbSrc = (k) => PB.SOURCES[k];
  function pbPlayCard(p, n) {
    const o = PB.offenseFor(p, n);
    const tag = n === 7 && o.size < 7 ? '<span class="pbtag">6v6 only</span>' : '';
    return `<div class="pbcard" role="button" tabindex="0" data-act="open-play" data-id="${p.id}"><div class="pbart">${PB.offenseSVG(p, n)}</div><div class="pbbar">${esc(p.name)}</div>
      <div class="pbmeta"><span class="pbcat ${p.cat}">${p.cat}</span>${tag}<span class="muted pbform">${esc(p.form)}</span><span class="grow"></span><span class="muted">${esc(pbSrc(p.src).short)}</span></div></div>`;
  }
  function pbCovCard(d) {
    const rush = d.d.filter((x) => x.rush).length;
    return `<div class="pbcard" role="button" tabindex="0" data-act="open-cov" data-id="${d.id}"><div class="pbart">${PB.defenseSVG(d)}</div><div class="pbbar">${esc(d.name)}</div>
      <div class="pbmeta"><span class="pbcat zone">Zone</span><span class="muted">${d.n} defenders · ${rush ? rush + ' rusher' + (rush > 1 ? 's' : '') : 'no rusher'}</span><span class="grow"></span><span class="muted">${esc(pbSrc(d.src).short)}</span></div></div>`;
  }
  function renderPlays() {
    const pb = S.pb; const off = pb.side !== 'def';
    const cnt = (c) => PB.OFFENSE.filter((p) => c === 'all' || p.cat === c).length;
    const list = off ? PB.OFFENSE.filter((p) => pb.cat === 'all' || p.cat === pb.cat) : PB.DEFENSE.filter((d) => d.n === pb.n);
    const key = (c, l, cls = '') => `<span><i class="${cls}" style="background:${c}"></i>${l}</span>`;
    const legend = off
      ? key(PB.COL.norm, 'Route') + key(PB.COL.primary, 'First read / target') + key(PB.COL.decoy, 'Decoy / clear-out') + key(PB.COL.add, pb.n === 7 ? '6th & 7th players' : '6th player') + key('transparent', 'Motion, pitch, QB path', 'dash')
      : key(PB.COL.zone.deep, 'Deep zone') + key(PB.COL.zone.hook, 'Hook / curl') + key(PB.COL.zone.flat, 'Flat') + key(PB.COL.zone.curl, 'Curl / flat') + key(PB.COL.primary, 'Rusher');
    const used = off ? ['ffp', 'fa', 'fd', 'nfl'] : ['nfldef', 'fd7', 'fd6'];
    return `<h2 class="sec">Playbook <span class="sub">${off ? 'Pass plays from published flag football playbooks. Tap a play for every assignment.' : 'Zone coverages from NFL FLAG and FirstDown PlayBook. Tap one for each defender\'s job.'}</span></h2>
      <div class="pbctl">${pbSeg('pb-side', off ? 'off' : 'def', [['off', 'Offense'], ['def', 'Defense']])}
        ${off ? pbSeg('pb-cat', pb.cat, [['all', `All ${cnt('all')}`], ['short', `Short ${cnt('short')}`], ['medium', `Medium ${cnt('medium')}`], ['long', `Long ${cnt('long')}`]]) : ''}
        ${pbSeg('pb-n', pb.n, [[6, '6 per side'], [7, '7 per side']])}</div>
      <div class="pbkey">${legend}</div>
      <div class="pbgrid">${list.map((x) => (off ? pbPlayCard(x, pb.n) : pbCovCard(x))).join('')}</div>
      <p class="tiny muted" style="margin-top:16px">Sources: ${used.map((k) => `<a href="${pbSrc(k).url}" target="_blank" rel="noopener">${esc(pbSrc(k).name)}</a>`).join(' · ')}</p>`;
  }
  function playModal(id) {
    const p = PB.OFFENSE.find((x) => x.id === id); if (!p) return;
    const n = S.pb.n; const o = PB.offenseFor(p, n); const src = pbSrc(p.src);
    openModal(`<div class="pbdetail"><div><div class="pbcard flat"><div class="pbart">${PB.offenseSVG(p, n)}</div><div class="pbbar">${esc(p.name)}</div></div>
        <div class="row" style="margin-top:10px">${pbSeg('pb-n-modal', n, [[6, '6 per side'], [7, '7 per side']], ` data-id="${p.id}"`)}<span class="small muted">${o.size} players on offense</span></div></div>
      <div><h3 style="margin-top:4px">${esc(p.form)} &nbsp;<span class="pbcat ${p.cat}">${p.cat}</span></h3>
        <ul class="pblist">${p.assign.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
        ${o.note ? `<div class="pbnote"><b>${n} on ${n}:</b> ${esc(o.note)}</div>` : ''}
        <p class="small" style="margin:12px 0">${esc(p.tip)}</p>
        <p class="tiny muted">Source: <a href="${src.url}" target="_blank" rel="noopener">${esc(src.name)}</a> (${esc(p.ref)}). ${p.drawn ? esc(p.drawn) : 'Drawn in the source\'s alignment.'}</p></div></div>`);
  }
  function covModal(id) {
    const d = PB.DEFENSE.find((x) => x.id === id); if (!d) return;
    const src = pbSrc(d.src), also = d.also ? pbSrc(d.also) : null;
    openModal(`<div class="pbdetail"><div><div class="pbcard flat"><div class="pbart">${PB.defenseSVG(d)}</div><div class="pbbar">${esc(d.name)}</div></div></div>
      <div><h3 style="margin-top:4px">${d.n} defenders &nbsp;<span class="pbcat zone">Zone</span></h3>
        <ul class="pblist">${d.text.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
        ${d.pro ? `<p class="small"><b style="color:var(--green)">Strength:</b> ${esc(d.pro)}</p>` : ''}${d.con ? `<p class="small"><b style="color:var(--red)">Weak spot:</b> ${esc(d.con)}</p>` : ''}
        <p class="tiny muted">Source: <a href="${src.url}" target="_blank" rel="noopener">${esc(src.name)}</a> (${esc(d.ref)})${also ? `; extra defenders follow <a href="${also.url}" target="_blank" rel="noopener">${esc(also.name)}</a>` : ''}.</p></div></div>`);
  }

  function openModal(html, narrow) {
    $('#modal-root').innerHTML = `<div class="scrim" data-act="close-modal-bg"><div class="modal ${narrow ? 'narrow' : ''}"><button class="xbtn" data-act="close-modal" aria-label="Close">×</button>${html}</div></div>`;
    document.body.style.overflow = 'hidden';
  }
  function ask(msg, okLabel = 'Confirm', input = false, danger = false) {
    return new Promise((res) => {
      openModal(`<h3 style="font-size:18px;text-transform:none;letter-spacing:0;font-family:system-ui">${esc(msg)}</h3>${input ? '<input id="ask-in" style="width:100%;margin-top:10px">' : ''}<div class="row" style="margin-top:16px"><button class="btn ${danger ? 'danger' : 'pri'}" id="ask-ok">${esc(okLabel)}</button><button class="btn ghost" id="ask-cancel">Cancel</button></div>`, true);
      const inp = $('#ask-in'); if (inp) { inp.focus(); inp.onkeydown = (e) => { if (e.key === 'Enter') $('#ask-ok').click(); }; }
      $('#ask-ok').onclick = () => { const v = input ? $('#ask-in').value : true; closeModal(); res(v); };
      $('#ask-cancel').onclick = () => { closeModal(); res(input ? null : false); };
    });
  }
  function closeModal() { $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; if (S.dirty) render(); }

  // ----- draft -----
  function renderDraft() {
    const c = cfg(); const d = c.draft; const avail = C.draftable(c).sort((a, b) => C.ovr(b) - C.ovr(a)); const n = d.picks.length;
    const next = S.draftTeam || C.nextPickTeam(c); const done = !avail.length;
    const teamPanel = (t) => {
      const R = C.rosters(c)[t].map((id) => C.player(c, id)).filter(Boolean); const tr = C.teamRatings(c, t);
      return `<div class="tpanel" style="--tc:${tcol(t)}"><div class="thead"><span class="dot"></span><span class="tn">${esc(tname(t))}</span><span class="grow"></span><span class="small muted">${R.length} players</span></div>
        <ul class="rlist">${R.map((p) => `<li><span class="posb">${esc(p.pos || '—')}</span><span class="grow">${esc(p.name)}${c.teams[t].captainId === p.id ? ' <span class="tiny muted">(C)</span>' : ''}</span><span class="small muted">${p.num !== '' ? '#' + esc(p.num) : ''}</span><span class="ovrb">${C.ovr(p)}</span></li>`).join('') || '<li class="muted small">No players yet</li>'}</ul>
        <div class="ratings3"><div><b>${tr.ovr || '—'}</b><span>OVR</span></div><div><b>${tr.off || '—'}</b><span>OFF</span></div><div><b>${tr.def || '—'}</b><span>DEF</span></div></div></div>`;
    };
    const capsSet = c.teams.A.captainId && c.teams.B.captainId;
    return `<h2 class="sec">Draft board <span class="sub">${isCommish() ? 'Enter picks from the group-text draft. Tap a player to draft them.' : 'Results from the draft'}</span></h2>
      ${!capsSet ? '<div class="banner">Captains aren\'t set yet. ' + (isCommish() ? 'Pick them on the Players tab.' : '') + '</div>' : ''}
      <div class="clock" style="margin-top:12px;--tc:${tcol(next)}">
        ${done ? '<div class="big">Draft complete</div>' : `<span class="dot" style="width:16px;height:16px"></span><div><div class="tiny muted" style="letter-spacing:.12em;font-weight:800">PICK ${n + 1} · ROUND ${Math.floor(n / 2) + 1}</div><div class="big">${esc(tname(next))} on the clock</div></div>`}
        <span class="grow"></span>
        ${isCommish() ? `<div class="row">${!done ? `<button class="btn sm" data-act="switch-team">Switch team</button>` : ''}<button class="btn sm" data-act="undo-pick" ${n ? '' : 'disabled'}>Undo last pick</button><button class="btn sm danger" data-act="reset-draft" ${n ? '' : 'disabled'}>Reset draft</button></div>` : ''}
      </div>
      ${isCommish() ? `<div class="row small" style="margin-top:10px"><label class="muted">Order <select data-change="draft-order"><option value="snake" ${d.order !== 'alternating' ? 'selected' : ''}>Snake</option><option value="alternating" ${d.order === 'alternating' ? 'selected' : ''}>Alternating</option></select></label><label class="muted">First pick <select data-change="draft-first"><option value="A" ${d.first !== 'B' ? 'selected' : ''}>${esc(tname('A'))}</option><option value="B" ${d.first === 'B' ? 'selected' : ''}>${esc(tname('B'))}</option></select></label></div>` : ''}
      <div class="teams2" style="margin-top:14px">${teamPanel('A')}${teamPanel('B')}</div>
      ${!done ? `<h2 class="sec">Available <span class="sub">${avail.length} left · sorted by OVR</span></h2><div class="grid">${avail.map((p) => card(p, { act: isCommish() ? 'draft-player' : 'open-player' })).join('')}</div>` : ''}
      ${n ? `<h2 class="sec">Pick history</h2><div class="panel"><ul class="picks">${d.picks.map((pk, i) => { const p = C.player(c, pk.playerId); return `<li><span class="kbd">${Math.floor(i / 2) + 1}.${String(i % 2 + 1).padStart(2, '0')}</span><span class="dot" style="--tc:${tcol(pk.team)}"></span><b>${esc(tname(pk.team))}</b><span class="grow">${esc(p?.name || '?')} <span class="muted small">${esc(p?.pos || '')} · ${p ? C.ovr(p) : ''} OVR</span></span></li>`; }).join('')}</ul></div>` : ''}`;
  }
  function draftConfirm(id) {
    const c = cfg(); const p = C.player(c, id); const t = S.draftTeam || C.nextPickTeam(c);
    const opt = (x) => `<button class="pill ${x === t ? 'on' : ''}" data-act="draft-team-pick" data-team="${x}" data-id="${esc(id)}">${esc(tname(x))}</button>`;
    openModal(`<h3 style="font-size:20px">Draft ${esc(p.name)}?</h3><div class="muted small" style="margin:4px 0 12px">${esc(p.pos || 'No position')} · ${C.ovr(p)} OVR</div>
      <div class="pills">${opt('A')}${opt('B')}</div>
      <div class="row" style="margin-top:16px"><button class="btn pri" data-act="confirm-pick" data-id="${esc(id)}" data-team="${t}">Draft to ${esc(tname(t))}</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>`, true);
  }

  // ----- rules -----
  const RULES = [["The basics", ["Even numbers on the field. If one team has an extra player, he rotates in.", "Snapper optional: take a snap, or let the QB start with the ball and yell hike. Everyone is an eligible receiver.", "No kickoffs or punts. Every drive starts at your own 5.", "Coin toss winner picks ball or end. The other team gets the ball to start the 2nd half.", "Four <b>12-minute quarters</b>, running clock. Switch ends at halftime. One timeout per team per half."]], ["Scoring", ["Touchdown: <b>6</b>", "Extra point: <b>1</b> from the 5 (pass only) or <b>2</b> from the 10 (run or pass). Call it before the snap.", "Defense takes a pick or fumble on an extra point all the way back: <b>2</b>.", "Safety: <b>2</b>, and the defense gets the ball."]], ["Downs", ["<b>4 downs</b> to cross midfield, then <b>4 downs</b> to score.", "Come up short and the other team takes over at its own 5."]], ["Rushing the passer", ["<b>One rusher.</b> He counts out loud to <b>7 Mississippi</b>, then rushes.", "<b>One blitz per drive:</b> the rusher goes right at the snap, no count.", "Everyone else stays on their side of the line. A handoff, fake, pitch, backward pass or QB run ends the count, and then anyone can go.", "Pull the QB's flag, but <b>don't hit the QB</b>. Jumping to block a pass is fine.", "Sack: the QB's flag is pulled behind the line. Throwing it away is legal."]], ["QB runs & trick plays", ["<b>One QB run per drive:</b> the QB can take off on his own once each drive. Otherwise, he can only run after the rusher crosses the line.", "Handoffs are legal behind the line. Laterals and backward pitches or passes are legal anywhere, even past the line.", "<b>Trick plays are on.</b> Whoever has the ball behind the line can throw the play's one forward pass. Flea flickers, halfback passes, double passes and hook and ladders are all fair game.", "A dropped pitch or backward pass is a live ball, just like a fumble.", "<b>No-run zones:</b> inside 5 yards of midfield or the goal line, it's pass only. No scrambles either."]], ["Ball or knee on the ground", ["The play ends when the runner's flag comes off or he steps out of bounds.", "<b>Going down isn't down.</b> While you're on the ground, one touch from a defender ends it. If nobody touches you, get up and keep running.", "<b>Fumbles are live.</b> Anyone can scoop it up and run it back, dropped snaps included.", "Incomplete passes are dead, not fumbles.", "Spot the ball where it was when the play ended.", "No diving forward with the ball.", "Flag fell off? You're down right there, even if nobody touched you.", "Catches need one foot in bounds."]], ["Blocking & contact", ["<b>No blocking.</b> No screens, no picks, no escorting the runner.", "Bumping on a route happens. Running into a defender on purpose doesn't.", "Defense: no holding, pushing, jamming or hitting receivers, and no stripping the ball. Pull flags, don't tackle."]], ["Flags & flag guarding", ["Flags on both hips, outside your clothes. Tuck in the hoodie: a covered flag counts as flag guarding.", "<b>Flag guarding</b> is a hand, arm or the ball over your flag, a stiff arm, or a lowered shoulder. Spin and juke all you want.", "Only the ball carrier's flag can be pulled. Pull one early or grab a shirt: 5 yards, and that player is down on a one-hand touch instead."]], ["Turnovers", ["Picks and fumbles can be run back. No score? Your offense starts where you're downed.", "Downed in your own end zone after a turnover? Start at your own 5."]], ["Penalties", ["<b>Offense</b> (flag guarding, blocking, illegal QB run, running in a no-run zone, offensive PI): 5 yards and loss of down.", "<b>Defense</b> (early or extra rusher, offside, illegal flag pull): 5 yards.", "Holding or roughing the QB: 10 yards and a first down.", "Pass interference: ball at the spot of the foul and a first down.", "The team that was fouled can always decline and take the play."]], ["Overtime", ["Coin toss, then teams trade 1-point tries from the 5 (pass only).", "The first round where one team scores and the other doesn't ends it. The winner gets 1 point added."]], ["Disputes", ["Captains settle it. Can't agree? Replay the down.", "The commish has the final say, including on stats and bets."]]];
  function renderRules() {
    return `<h2 class="sec">Rules <span class="sub">House rules. Not that serious, still binding.</span></h2>
      <div class="rules">${RULES.map(([t, items]) => `<div class="panel"><h3>${t}</h3><ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
      <p class="tiny muted" style="margin-top:4px">Adapted from the <a href="https://static.www.nfl.com/image/upload/league/gxtdqh8hcquhezyzssfo.pdf" target="_blank" rel="noopener">NFL FLAG rulebook</a>, simplified for a game with no refs.</p>`;
  }

  // ----- teams -----
  function renderTeams() {
    const c = cfg(); const pr = C.projection(c); const has = pr.a.n && pr.b.n;
    const tp = (t) => {
      const R = C.rosters(c)[t].map((id) => C.player(c, id)).filter(Boolean).sort((a, b) => (a.pos === 'QB' ? -1 : b.pos === 'QB' ? 1 : C.ovr(b) - C.ovr(a)));
      const tr = C.teamRatings(c, t);
      return `<div class="tpanel" style="--tc:${tcol(t)}"><div class="thead"><span class="dot"></span><span class="tn">${esc(tname(t))}</span></div>
        ${isCommish() ? `<div class="row small" style="padding:10px 14px;border-bottom:1px solid var(--line)"><input data-change="team-name" data-team="${t}" value="${esc(c.teams[t].name || '')}" placeholder="${esc(tname(t))}" style="flex:1"><select data-change="team-color" data-team="${t}">${TEAM_COLORS.map(([n, h]) => `<option value="${h}" ${tcol(t) === h ? 'selected' : ''}>${n}</option>`).join('')}</select></div>` : ''}
        <div class="ratings3"><div><b>${tr.ovr || '—'}</b><span>TEAM OVR</span></div><div><b>${tr.off || '—'}</b><span>OFF</span></div><div><b>${tr.def || '—'}</b><span>DEF</span></div></div>
        <ul class="rlist" style="border-top:1px solid var(--line)">${R.map((p) => `<li data-act="open-player" data-id="${esc(p.id)}" style="cursor:pointer"><span class="posb">${esc(p.pos || '—')}</span><span class="grow">${esc(p.name)}${c.teams[t].captainId === p.id ? ' <span class="tiny muted">(C)</span>' : ''}</span><span class="small muted">DEF ${C.def(p)}</span><span class="ovrb">${C.ovr(p)}</span></li>`).join('') || '<li class="muted small">Draft not entered yet</li>'}</ul></div>`;
    };
    const avgA = (t, a) => { const ps = C.rosters(c)[t].map((id) => C.player(c, id)).filter(Boolean); return ps.length ? Math.round(ps.reduce((s, p) => s + p.ratings[a], 0) / ps.length) : 0; };
    const tape = C.ATTRS.map((a) => { const x = avgA('A', a), y = avgA('B', a); return `<div class="tape"><b style="text-align:right;color:${x >= y ? 'var(--text)' : 'var(--muted)'}">${x || '—'}</b><div class="bar l"><i style="width:${x}%;background:${tcol('A')}"></i></div><span class="small muted" style="text-align:center;font-weight:700">${a}</span><div class="bar"><i style="width:${y}%;background:${tcol('B')}"></i></div><b style="color:${y >= x ? 'var(--text)' : 'var(--muted)'}">${y || '—'}</b></div>`; }).join('');
    const fav = pr.margin >= 0 ? 'A' : 'B'; const m = Math.abs(pr.margin); const p = fav === 'A' ? pr.probA : 1 - pr.probA;
    return `<h2 class="sec">Teams</h2>
      ${has ? `<div class="banner" style="background:rgba(60,207,127,.08);border-color:rgba(60,207,127,.35);color:#bff2d4">Ratings projection: <b>${m < 0.75 ? 'pick\'em' : esc(tname(fav)) + ' by ' + (Math.round(m * 2) / 2)}</b> · ${esc(tname(fav))} win probability ${Math.round(p * 100)}%</div>` : ''}
      <div class="teams2" style="margin-top:14px">${tp('A')}${tp('B')}</div>
      ${has ? `<h2 class="sec">Tale of the tape <span class="sub">Average rating by category</span></h2><div class="panel"><div class="row small muted" style="justify-content:space-between;margin-bottom:6px"><span>${esc(tname('A'))}</span><span>${esc(tname('B'))}</span></div>${tape}</div>` : ''}`;
  }

  // ----- sportsbook -----
  function oddsBtn(market, sel, label, sub, o = {}) {
    const g = game(); const open = g.linesPosted && !g.betsLocked && g.status === 'pre';
    const on = S.slip && S.slip.market === market && S.slip.sel === sel && (S.slip.propId || null) === (o.propId || null);
    return `<button class="ob ${on ? 'sel' : ''}" data-act="pick-bet" data-market="${market}" data-sel="${esc(sel)}" ${o.propId ? `data-prop="${esc(o.propId)}"` : ''} ${open && !o.off ? '' : 'disabled'} ${o.off ? 'title="No unders on your own props"' : ''}>${label}${sub !== undefined ? `<small>${sub}</small>` : ''}</button>`;
  }
  function renderBook() {
    const c = cfg(); const g = game(); const L = c.lines; const me = S.me && ledger[S.me.id];
    const status = g.status === 'final' ? ['Final: bets are settled', 'var(--green)'] : !g.linesPosted ? ['Lines not posted yet', 'var(--muted)'] : g.betsLocked || g.status !== 'pre' ? ['Betting locked', 'var(--red)'] : ['Betting open', 'var(--green)'];
    let html = `<h2 class="sec">Sportsbook <span class="sub" style="color:${status[1]};font-weight:700">${status[0]}</span></h2>`;
    if (me) {
      html += `<div class="panel"><div class="row" style="margin-bottom:10px"><b style="font-size:17px">${esc(me.name)}</b><span class="grow"></span><button class="btn sm ghost" data-act="logout">Log out</button></div>
        <div class="money"><div><span>Available</span><b>${money(me.available)}</b></div><div><span>At risk</span><b>${money(me.atRisk)}</b></div><div><span>Bankroll</span><b style="color:${me.bankroll >= (c.settings?.bankroll ?? 100) ? 'var(--green)' : 'var(--red)'}">${money(me.bankroll)}</b></div></div></div>`;
    } else {
      const claimed = new Set((S.snap.bettors || []).map((b) => b.playerId).filter(Boolean));
      html += `<div class="teams2"><div class="panel"><h3>Join the book</h3><div class="small muted" style="margin-bottom:10px">Everyone starts with ${money(c.settings?.bankroll ?? 100)} in fake money.</div>
        <div class="row"><select id="join-who" data-change="join-who" class="grow">${c.players.filter((p) => !claimed.has(p.id)).map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}<option value="">Someone else</option></select></div>
        <div class="row" style="margin-top:8px"><input id="join-name" placeholder="Your name" class="grow ${c.players.some((p) => !claimed.has(p.id)) ? 'hide' : ''}"><input id="join-pin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" style="width:130px"><button class="btn pri" data-act="join">Join</button></div></div>
        <div class="panel"><h3>Log in</h3><div class="small muted" style="margin-bottom:10px">Already joined on another device?</div>
        <div class="row"><select id="login-who" class="grow">${(S.snap.bettors || []).map((b) => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('') || '<option value="">No one has joined yet</option>'}</select><input id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="width:90px"><button class="btn" data-act="login">Log in</button></div></div></div>`;
    }
    if (L && (g.linesPosted || isCommish())) {
      if (!g.linesPosted) html += '<div class="banner">Preview: only you can see these until you post the lines.</div>';
      const sp = Number(L.spread.A); const tot = L.total.points;
      const trow = (t) => { const line = t === 'A' ? sp : -sp; return `<div class="tname"><span class="dot" style="--tc:${tcol(t)}"></span>${esc(tname(t))}</div>
        ${oddsBtn('spread', t, sgn(line), C.fmtOdds(L.spread.odds))}${oddsBtn('ml', t, C.fmtOdds(L.ml[t]), 'to win')}${oddsBtn('total', t === 'A' ? 'over' : 'under', (t === 'A' ? 'O ' : 'U ') + tot, C.fmtOdds(L.total.odds))}`; };
      html += `<h2 class="sec">Game lines</h2><div class="panel"><div class="odds"><div></div><div class="h">Spread</div><div class="h">Moneyline</div><div class="h">Total</div>${trow('A')}${trow('B')}</div></div>`;
      const byP = {}; for (const pr of L.props || []) (byP[pr.playerId] = byP[pr.playerId] || []).push(pr);
      const pcards = Object.entries(byP).map(([pid, list]) => { const p = C.player(c, pid); if (!p) return ''; const t = C.teamOf(c, pid);
        return `<div class="panel"><div class="row" style="margin-bottom:4px"><span class="posb">${esc(p.pos || '—')}</span><b>${esc(p.name)}</b><span class="grow"></span>${t ? `<span class="small muted"><span class="dot" style="--tc:${tcol(t)};width:8px;height:8px"></span> ${esc(tname(t))}</span>` : ''}</div>
          ${list.map((pr) => `<div class="prow"><span>${esc(C.STATS[pr.stat] || pr.stat)}</span>${oddsBtn('prop', 'over', 'O ' + pr.line, C.fmtOdds(pr.odds), { propId: pr.id })}${oddsBtn('prop', 'under', 'U ' + pr.line, C.fmtOdds(pr.odds), { propId: pr.id, off: S.me && S.me.playerId === pr.playerId })}</div>`).join('')}</div>`; }).join('');
      if (pcards) html += `<h2 class="sec">Player props</h2><div class="props">${pcards}</div>`;
      if ((L.ftd || []).length) html += `<h2 class="sec">First TD scorer</h2><div class="props">${[...L.ftd].sort((a, b) => a.odds - b.odds).map((f) => { const p = C.player(c, f.playerId); return p ? `<div class="prow" style="grid-template-columns:1fr 110px;margin:0" ><span><span class="posb">${esc(p.pos || '—')}</span> ${esc(p.name)}</span>${oddsBtn('ftd', f.playerId, C.fmtOdds(f.odds))}</div>` : ''; }).join('')}</div>`;
    } else if (!g.linesPosted) html += `<div class="empty" style="margin-top:14px">Lines drop after the draft. Check back soon.</div>`;
    if (me && me.bets.length) html += `<h2 class="sec">My bets</h2><div class="panel scroll-x">${betTable(me.bets, false)}</div>`;
    const lb = Object.values(ledger).sort((a, b) => b.bankroll - a.bankroll);
    if (lb.length) html += `<h2 class="sec">Leaderboard</h2><div class="panel scroll-x"><table class="t"><tr><th>#</th><th>Bettor</th><th class="n">Bankroll</th><th class="n">Available</th><th class="n">At risk</th><th class="n">W-L</th></tr>${lb.map((b, i) => `<tr><td>${i + 1}</td><td><b>${esc(b.name)}</b></td><td class="n"><b>${money(b.bankroll)}</b></td><td class="n">${money(b.available)}</td><td class="n">${money(b.atRisk)}</td><td class="n">${b.won}-${b.lost}</td></tr>`).join('')}</table></div>`;
    const all = Object.values(ledger).flatMap((b) => b.bets.map((x) => ({ ...x, who: b.name }))).sort((a, b) => b.ts - a.ts);
    if (all.length) html += `<h2 class="sec">Bet feed <span class="sub">${all.length} bets</span></h2><div class="panel scroll-x">${betTable(all, true)}</div>`;
    if (isCommish()) html += linesEditor();
    return html;
  }
  function betTable(bets, who) {
    const c = cfg();
    return `<table class="t"><tr>${who ? '<th>Bettor</th>' : ''}<th>Bet</th><th class="n">Odds</th><th class="n">Stake</th><th class="n">Pays</th><th>Status</th>${who && isCommish() ? '<th></th>' : ''}</tr>${bets.map((b) => `<tr>${who ? `<td><b>${esc(b.who)}</b></td>` : ''}<td>${esc(C.describe(b, c))}</td><td class="n">${C.fmtOdds(b.odds)}</td><td class="n">${money(b.stake)}</td><td class="n">${b.status === 'open' ? money(b.stake + C.profit(b.stake, b.odds)) : money(b.ret)}</td><td><span class="st ${b.status}">${b.status}</span></td>${who && isCommish() ? `<td>${b.status !== 'void' ? `<button class="btn sm ghost" data-act="void-bet" data-id="${esc(b.id)}">Void</button>` : ''}</td>` : ''}</tr>`).join('')}</table>`;
  }
  function linesEditor() {
    const c = cfg(); const g = game(); const D = S.linesDraft || (c.lines ? structuredClone(c.lines) : null);
    S.linesDraft = D;
    const num = (path, v, step = 0.5, w = 90) => `<input type="number" step="${step}" data-lines="${path}" value="${v}" style="width:${w}px">`;
    let h = `<h2 class="sec">Commissioner: lines and betting</h2><div class="panel">
      <div class="row"><button class="btn gold" data-act="suggest-lines">Suggest lines from ratings</button>${D ? '<button class="btn pri" data-act="save-lines">Save lines</button>' : ''}<span class="grow"></span>
      ${c.lines ? (g.linesPosted ? '<button class="btn" data-act="unpost-lines">Hide lines</button>' : '<button class="btn pri" data-act="post-lines">Post lines</button>') : ''}
      ${g.linesPosted ? (g.betsLocked ? '<button class="btn" data-act="unlock-bets">Unlock bets</button>' : '<button class="btn danger" data-act="lock-bets">Lock bets</button>') : ''}</div>
      <div class="tiny muted" style="margin-top:8px">Odds use American format: 100 = even money, -150 = bet $150 to win $100, +250 = bet $100 to win $250. Changing a line doesn't change bets already placed.</div>`;
    if (D) {
      h += `<div class="row" style="margin-top:14px;align-items:flex-end;gap:16px">
        <label class="fl">${esc(tname('A'))} spread${num('spread.A', D.spread.A)}</label><label class="fl">Spread odds${num('spread.odds', D.spread.odds, 5)}</label>
        <label class="fl">${esc(tname('A'))} ML${num('ml.A', D.ml.A, 5)}</label><label class="fl">${esc(tname('B'))} ML${num('ml.B', D.ml.B, 5)}</label>
        <label class="fl">Total points${num('total.points', D.total.points)}</label><label class="fl">Total odds${num('total.odds', D.total.odds, 5)}</label></div>
        <h3 style="margin-top:16px">Player props</h3><div class="scroll-x"><table class="t"><tr><th>Player</th><th>Stat</th><th>Line</th><th>Odds</th><th></th></tr>
        ${(D.props || []).map((pr, i) => `<tr><td><select data-lines="props.${i}.playerId">${c.players.map((p) => `<option value="${esc(p.id)}" ${p.id === pr.playerId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></td>
          <td><select data-lines="props.${i}.stat">${Object.entries(C.STATS).map(([k, l]) => `<option value="${k}" ${k === pr.stat ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
          <td>${num(`props.${i}.line`, pr.line)}</td><td>${num(`props.${i}.odds`, pr.odds, 5)}</td><td><button class="btn sm ghost" data-act="del-prop" data-i="${i}">Remove</button></td></tr>`).join('')}</table></div>
        <button class="btn sm" data-act="add-prop" style="margin-top:8px">Add prop</button>
        <h3 style="margin-top:16px">First TD scorer odds</h3><div class="row">${(D.ftd || []).map((f, i) => { const p = C.player(c, f.playerId); return p ? `<label class="fl">${esc(p.name)}${num(`ftd.${i}.odds`, f.odds, 25, 96)}</label>` : ''; }).join('')}</div>`;
    }
    h += `<div class="row" style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><span class="small muted grow">Danger zone</span><button class="btn sm danger" data-act="reset-book">Reset all bets and accounts</button></div></div>`;
    return h;
  }
  function renderSlip() {
    const r = $('#slip-root'); if (!S.slip || S.tab !== 'book') { r.innerHTML = ''; return; }
    const c = cfg(); const q = C.quote(c, S.slip.market, S.slip.sel, S.slip.propId);
    if (typeof q === 'string') { S.slip = null; r.innerHTML = ''; return; }
    const bet = { ...S.slip, line: q.line, odds: q.odds, playerId: q.playerId, stat: q.stat };
    const me = S.me && ledger[S.me.id]; const stake = Number(S.slip.stake) || 0;
    r.innerHTML = `<div class="slip"><div class="row"><b class="grow">${esc(C.describe(bet, c))}</b><span class="kbd">${C.fmtOdds(q.odds)}</span><button class="btn sm ghost" data-act="clear-slip" aria-label="Clear">×</button></div>
      ${me ? `<div class="row" style="margin-top:10px"><input id="stake" data-input="stake" type="number" min="1" step="1" inputmode="decimal" value="${esc(S.slip.stake || '')}" placeholder="Stake $" style="width:110px">${[5, 10, 25].map((v) => `<button class="btn sm" data-act="stake" data-v="${v}">$${v}</button>`).join('')}<button class="btn sm" data-act="stake" data-v="max">Max</button></div>
      <div class="row" style="margin-top:10px"><span class="small muted grow" id="towin">To win ${money(C.profit(stake, q.odds))} · available ${money(me.available)}</span><button class="btn pri" data-act="place-bet">Place bet</button></div>` : `<div class="row" style="margin-top:10px"><span class="small muted grow">Join or log in above to place bets.</span></div>`}</div>`;
  }

  // ----- scoreboard -----
  function renderScore() {
    const c = cfg(); const g = game(); const st = stats; const A = st.teams.A, B = st.teams.B;
    const qs = [1, 2, 3, 4].concat([A, B].some((t) => t.byQ[5]) ? [5] : []);
    const statusTxt = g.status === 'final' ? '<div class="small" style="font-weight:800;letter-spacing:.12em">FINAL</div>' : g.status === 'live' ? `<div class="live">LIVE · ${C.qLabel(g.quarter || 1)}</div>` : '<div class="small muted" style="font-weight:800;letter-spacing:.12em">PREGAME</div>';
    let h = `<h2 class="sec">Scoreboard</h2>
      <div class="sb"><div class="side" style="--tc:${tcol('A')}"><span class="dot" style="width:14px;height:14px"></span><div class="nm">${esc(tname('A'))}</div><div class="pts">${A.pts}</div></div>
      <div class="mid">${statusTxt}<div class="tiny muted" style="margin-top:6px">vs</div></div>
      <div class="side" style="--tc:${tcol('B')}"><span class="dot" style="width:14px;height:14px"></span><div class="nm">${esc(tname('B'))}</div><div class="pts">${B.pts}</div></div></div>
      <div class="panel scroll-x" style="margin-top:10px"><table class="t"><tr><th>Team</th>${qs.map((q) => `<th class="n">${C.qLabel(q)}</th>`).join('')}<th class="n">T</th></tr>
      ${['A', 'B'].map((t) => `<tr><td><span class="dot" style="--tc:${tcol(t)};width:9px;height:9px"></span> <b>${esc(tname(t))}</b></td>${qs.map((q) => `<td class="n">${st.teams[t].byQ[q] ?? '–'}</td>`).join('')}<td class="n"><b>${st.teams[t].pts}</b></td></tr>`).join('')}</table></div>`;
    if (isCommish()) h += statEntry();
    const log = [...st.log].sort((x, y) => (y.q - x.q) || (y.ts - x.ts));
    let ra = 0, rb = 0; const running = {}; for (const e of [...st.log]) { if (e.team === 'A') ra += e.pts || 0; if (e.team === 'B') rb += e.pts || 0; running[e.id] = ra + '-' + rb; }
    h += `<h2 class="sec">Play-by-play <span class="sub">${log.length} plays</span></h2>`;
    h += log.length ? `<div class="panel"><ul class="picks">${log.map((e) => { const p = e.playerId && C.player(c, e.playerId); const t = e.team; const ev = C.EVENTS[e.type];
      return `<li><span class="kbd">${C.qLabel(e.q)}</span>${t ? `<span class="dot" style="--tc:${tcol(t)}"></span>` : ''}<span class="grow">${p ? '<b>' + esc(p.name) + '</b> · ' : ''}${esc(ev?.label || e.type)}${e.type === 'points' ? ' (' + sgn(e.pts) + ')' : ''}${t ? ' · ' + esc(tname(t)) : ''}${e.note ? ' <span class="muted small">' + esc(e.note) + '</span>' : ''}</span>${e.pts ? `<span class="small muted">${running[e.id]}</span>` : ''}${isCommish() ? `<button class="btn sm ghost" data-act="del-event" data-id="${esc(e.id)}" aria-label="Delete">Delete</button>` : ''}</li>`; }).join('')}</ul></div>` : '<div class="empty">No plays logged yet.</div>';
    const cols = [['rec', 'REC'], ['recTD', 'REC TD'], ['rushTD', 'RUSH TD'], ['passTD', 'PASS TD'], ['comp', 'COMP'], ['intThrown', 'INT THR'], ['defINT', 'DEF INT'], ['sacks', 'SACK'], ['totalTD', 'TD']];
    h += `<h2 class="sec">Box score</h2><div class="teams2">${['A', 'B'].map((t) => { const R = C.rosters(c)[t].map((id) => C.player(c, id)).filter(Boolean);
      return `<div class="tpanel" style="--tc:${tcol(t)}"><div class="thead"><span class="dot"></span><span class="tn">${esc(tname(t))}</span></div><div class="scroll-x"><table class="t box"><tr><th>Player</th>${cols.map(([, l]) => `<th class="n">${l.replace(' ', '<br>')}</th>`).join('')}</tr>${R.map((p) => `<tr><td><b>${esc(p.name)}</b> <span class="tiny muted">${esc(p.pos || '')}</span></td>${cols.map(([k]) => `<td class="n">${st.players[p.id]?.[k] || ''}</td>`).join('')}</tr>`).join('') || `<tr><td class="muted" colspan="${cols.length + 1}">No roster yet</td></tr>`}</table></div></div>`; }).join('')}</div>`;
    return h;
  }
  function statEntry() {
    const c = cfg(); const g = game(); const ev = S.ev; const def = C.EVENTS[ev.type]; const R = C.rosters(c);
    const popts = ['A', 'B'].map((t) => `<optgroup label="${esc(tname(t))}">${R[t].map((id) => { const p = C.player(c, id); return `<option value="${esc(id)}" ${ev.playerId === id ? 'selected' : ''}>${esc(p.name)} (${esc(p.pos || '—')})</option>`; }).join('')}</optgroup>`).join('');
    return `<h2 class="sec">Commissioner: game and stats</h2><div class="panel">
      <div class="row"><span class="small muted">Game status</span><div class="pills">${[['pre', 'Pregame'], ['live', 'Live'], ['final', 'Final']].map(([k, l]) => `<button class="pill ${g.status === k ? 'on' : ''}" data-act="game-status" data-s="${k}">${l}</button>`).join('')}</div>
      <span class="grow"></span><span class="tiny muted">Final settles every bet. Switch back to Live to fix a stat and bets re-settle when you go Final again.</span></div>
      <div class="row" style="margin-top:14px;align-items:flex-end">
        <label class="fl">Quarter<select data-change="evq">${C.QUARTERS.map((q) => `<option value="${q}" ${S.evq === q ? 'selected' : ''}>${C.qLabel(q)}</option>`).join('')}</select></label>
        <label class="fl">Play<select data-change="evtype">${Object.entries(C.EVENTS).map(([k, v]) => `<option value="${k}" ${ev.type === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        ${def.needs === 'player' ? `<label class="fl grow">${['int', 'pick6', 'sack'].includes(ev.type) ? 'Defender' : ev.type === 'rushTD' ? 'Runner' : 'Receiver'}<select data-change="evplayer"><option value="">Pick a player</option>${popts}</select></label>` : `<label class="fl">Team<select data-change="evteam">${['A', 'B'].map((t) => `<option value="${t}" ${ev.team === t ? 'selected' : ''}>${esc(tname(t))}</option>`).join('')}</select></label>${['pat1', 'pat2'].includes(ev.type) ? `<label class="fl grow">Scored by (optional)<select data-change="evplayer"><option value="">—</option>${R[ev.team].map((id) => `<option value="${esc(id)}" ${ev.playerId === id ? 'selected' : ''}>${esc(C.player(c, id).name)}</option>`).join('')}</select></label>` : ''}${ev.type === 'points' ? `<label class="fl">Points (+/-)<input data-input="evpts" type="number" step="1" value="${esc(ev.pts)}" style="width:90px"></label>` : ''}`}
        <button class="btn pri" data-act="add-event">Add play</button></div>
      <div class="tiny muted" style="margin-top:8px">Catches and TD catches credit the team's QB with a completion and pass TD. INTs and pick-sixes charge the other team's QB. Plays can be logged live or after the game; set the quarter first.</div>
      <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><span class="small muted grow">Danger zone</span><button class="btn sm danger" data-act="reset-game">Clear all plays and reset game</button></div></div>`;
  }

  // ---------- actions ----------
  const A = {
    tab(el) { S.tab = el.dataset.tab; LS.set('tb-tab', S.tab); S.dirty = false; render(); window.scrollTo(0, 0); },
    'pb-side'(el) { S.pb.side = el.dataset.v; LS.set('tb-pb', S.pb); render(); },
    'pb-cat'(el) { S.pb.cat = el.dataset.v; LS.set('tb-pb', S.pb); render(); },
    'pb-n'(el) { S.pb.n = Number(el.dataset.v); LS.set('tb-pb', S.pb); render(); },
    'pb-n-modal'(el) { S.pb.n = Number(el.dataset.v); LS.set('tb-pb', S.pb); render(); playModal(el.dataset.id); },
    'open-play'(el) { playModal(el.dataset.id); },
    'open-cov'(el) { covModal(el.dataset.id); },
    filter(el) { S.filter = el.dataset.f; render(); },
    'open-player'(el) { playerModal(el.dataset.id); },
    noop() {},
    'edit-player'(el) { playerModal(el.dataset.id, true); },
    'close-modal'() { closeModal(); },
    'close-modal-bg'(el, e) { if (e.target === el) closeModal(); },
    async 'save-player'(el) {
      const m = $('.modal'); const f = (k) => m.querySelector(`[data-f="${k}"]`)?.value ?? '';
      const ratings = {}; for (const a of C.ATTRS) { const v = Math.round(Number(f('r-' + a))); if (!(v >= 1 && v <= 99)) return toast(`${C.ATTR_NAMES[a]} must be 1 to 99`, 'err'); ratings[a] = v; }
      const ov = f('ovr').trim(); if (ov && !(Number(ov) >= 1 && Number(ov) <= 99)) return toast('OVR override must be 1 to 99', 'err');
      if (!f('name').trim()) return toast('Enter a name', 'err');
      if (await act(el, () => saveConfig((c) => { const p = c.players.find((x) => x.id === el.dataset.id); Object.assign(p, { name: f('name').trim(), num: f('num').trim(), pos: f('pos'), ovrOverride: ov ? Math.round(Number(ov)) : null, ratings, comps: Object.fromEntries(['worst', 'base', 'best'].map((k) => [k, { name: f(`comp-${k}-name`).trim(), note: f(`comp-${k}-note`).trim() }])) }); }, 'Saved'))) playerModal(el.dataset.id);
    },
    async 'delete-player'(el) {
      const p = C.player(cfg(), el.dataset.id); if (!(await ask(`Remove ${p.name}? This also removes them from the draft.`, 'Remove', false, true))) return;
      if (await act(el, () => saveConfig((c) => { c.players = c.players.filter((x) => x.id !== p.id); c.draft.picks = c.draft.picks.filter((k) => k.playerId !== p.id); for (const t of ['A', 'B']) if (c.teams[t].captainId === p.id) c.teams[t].captainId = null; }, 'Removed'))) closeModal();
    },
    async 'add-player'(el) {
      const name = await ask('New player name', 'Add player', true); if (!name || !name.trim()) return;
      const id = C.slug(name) + (cfg().players.some((p) => p.id === C.slug(name)) ? '-' + Date.now().toString(36).slice(-3) : '');
      if (await act(null, () => saveConfig((c) => { c.players.push({ id, name: name.trim(), num: '', pos: '', ratings: Object.fromEntries(C.ATTRS.map((a) => [a, 70])), ovrOverride: null, comps: { worst: { name: '', note: '' }, base: { name: '', note: '' }, best: { name: '', note: '' } } }); }, 'Added'))) playerModal(id, true);
    },
    commish() { pinModal(); },
    'commish-menu'() {
      openModal(`<h3 style="font-size:20px">Commissioner</h3><div class="small muted" style="margin:6px 0 14px">You're signed in as commissioner on this device.</div><div class="row"><button class="btn" data-act="commish-out">Sign out on this device</button></div>`, true);
    },
    'commish-out'() { S.pin = null; LS.del('tb-pin'); closeModal(); render(); toast('Signed out'); },
    async 'pin-submit'(el) {
      const pin = $('#pin-in').value.trim(); if (!/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits', 'err');
      await act(el, async () => { await call('POST', S.hasCommish ? '/commish/check' : '/commish/claim', { pin }); S.pin = pin; LS.set('tb-pin', pin); S.hasCommish = true; closeModal(); render(); toast('Commissioner tools unlocked', 'ok'); });
    },
    'draft-player'(el) { draftConfirm(el.dataset.id); },
    'draft-team-pick'(el) { S.draftTeam = el.dataset.team; draftConfirm(el.dataset.id); },
    async 'confirm-pick'(el) {
      const c = cfg(); const t = el.dataset.team; const p = C.player(c, el.dataset.id);
      if (p.pos === 'QB' && C.teamQB(c, t)) return toast(`${tname(t)} already has a QB`, 'err');
      if (await act(el, () => saveConfig((x) => { x.draft.picks.push({ team: t, playerId: p.id, ts: Date.now() }); }, `${p.name} to ${tname(t)}`))) { S.draftTeam = null; closeModal(); }
    },
    'switch-team'() { S.draftTeam = C.other(S.draftTeam || C.nextPickTeam(cfg())); render(); },
    async 'undo-pick'(el) { await act(el, () => saveConfig((c) => { c.draft.picks.pop(); }, 'Pick undone')); S.draftTeam = null; },
    async 'reset-draft'(el) { if (!(await ask('Clear every draft pick?', 'Reset draft', false, true))) return; await act(el, () => saveConfig((c) => { c.draft.picks = []; }, 'Draft reset')); S.draftTeam = null; },
    // book
    'pick-bet'(el) {
      const key = { market: el.dataset.market, sel: el.dataset.sel, propId: el.dataset.prop || null };
      if (S.slip && S.slip.market === key.market && S.slip.sel === key.sel && S.slip.propId === key.propId) S.slip = null; else S.slip = { ...key, stake: S.slip?.stake || '' };
      render();
    },
    'clear-slip'() { S.slip = null; render(); },
    stake(el) { const me = ledger[S.me?.id]; S.slip.stake = el.dataset.v === 'max' ? Math.floor((me?.available || 0) * 100) / 100 : el.dataset.v; renderSlip(); },
    async 'place-bet'(el) {
      const c = cfg(); const q = C.quote(c, S.slip.market, S.slip.sel, S.slip.propId); if (typeof q === 'string') return toast(q, 'err');
      const stake = Number(S.slip.stake); if (!(stake >= 1)) return toast('Enter a stake of at least $1', 'err');
      await act(el, async () => { await call('POST', '/bet', { bettorId: S.me.id, pin: S.me.pin, market: S.slip.market, sel: S.slip.sel, propId: S.slip.propId, line: q.line, odds: q.odds, stake }); S.slip = null; await refresh(true); toast('Bet placed', 'ok'); });
    },
    async join(el) {
      const who = $('#join-who').value; const p = who && C.player(cfg(), who); const name = p ? p.name : $('#join-name').value.trim(); const pin = $('#join-pin').value.trim();
      if (!name) return toast('Enter your name', 'err'); if (!/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits', 'err');
      await act(el, async () => { const r = await call('POST', '/join', { name, pin, playerId: p ? p.id : null }); S.me = { ...r.bettor, pin }; LS.set('tb-me', S.me); await refresh(true); toast(`Welcome, ${name}. You have ${money(cfg().settings?.bankroll ?? 100)}.`, 'ok'); });
    },
    async login(el) {
      const name = $('#login-who').value; const pin = $('#login-pin').value.trim(); if (!name) return;
      await act(el, async () => { const r = await call('POST', '/login', { name, pin }); S.me = { ...r.bettor, pin }; LS.set('tb-me', S.me); render(); toast('Logged in', 'ok'); });
    },
    logout() { S.me = null; LS.del('tb-me'); S.slip = null; render(); },
    'suggest-lines'() { S.linesDraft = C.suggestLines(cfg()); render(); toast('Suggested lines loaded. Review, then save.'); },
    async 'save-lines'(el) { const D = structuredClone(S.linesDraft); await act(el, () => saveConfig((c) => { c.lines = D; }, 'Lines saved')); S.linesDraft = null; render(); },
    'add-prop'() { const c = cfg(); S.linesDraft.props.push({ id: 'c-' + Date.now().toString(36), playerId: c.players[0].id, stat: 'rec', line: 0.5, odds: 100 }); render(); },
    'del-prop'(el) { S.linesDraft.props.splice(Number(el.dataset.i), 1); render(); },
    async 'post-lines'(el) { await act(el, () => setGame({ linesPosted: true }, 'Lines posted. Betting is open.')); },
    async 'unpost-lines'(el) { await act(el, () => setGame({ linesPosted: false }, 'Lines hidden')); },
    async 'lock-bets'(el) { if (!(await ask('Lock all betting? No new bets until you unlock.', 'Lock bets', false, true))) return; await act(el, () => setGame({ betsLocked: true }, 'Bets locked')); },
    async 'unlock-bets'(el) { await act(el, () => setGame({ betsLocked: false }, 'Betting reopened')); },
    async 'void-bet'(el) { if (!(await ask('Void this bet and refund the stake?', 'Void bet', false, true))) return; await act(el, async () => { await call('POST', '/bet/void', { pin: S.pin, betId: el.dataset.id }); await refresh(true); toast('Bet voided', 'ok'); }); },
    async 'reset-book'(el) { if (!(await ask('Delete every bet and betting account? This cannot be undone.', 'Reset sportsbook', false, true))) return; await act(el, async () => { await call('POST', '/reset', { pin: S.pin, what: 'book' }); S.me = null; LS.del('tb-me'); await refresh(true); toast('Sportsbook reset', 'ok'); }); },
    // game
    async 'game-status'(el) {
      const s = el.dataset.s; if (s === 'final' && !(await ask('Mark the game final and settle every bet?', 'Go final'))) return;
      await act(el, () => setGame({ status: s, ...(s === 'live' ? { quarter: S.evq } : {}), ...(s !== 'pre' ? { betsLocked: true } : {}) }, s === 'final' ? 'Final. Bets settled.' : s === 'live' ? 'Game is live. Betting is locked.' : 'Back to pregame'));
    },
    async 'add-event'(el) {
      const ev = S.ev; const def = C.EVENTS[ev.type];
      if (def.needs === 'player' && !ev.playerId) return toast('Pick a player', 'err');
      if (ev.type === 'points' && !Number(ev.pts)) return toast('Enter points, like 6 or -1', 'err');
      await act(el, async () => { await call('POST', '/event', { pin: S.pin, event: { type: ev.type, q: S.evq, playerId: def.needs === 'player' || ['pat1', 'pat2'].includes(ev.type) ? ev.playerId || null : null, team: ev.team, pts: ev.pts } }); S.ev = { ...S.ev, playerId: def.needs === 'player' ? '' : S.ev.playerId, pts: '' }; await refresh(true); toast(def.label + ' added', 'ok'); });
    },
    async 'del-event'(el) { await act(el, async () => { await call('POST', '/event/delete', { pin: S.pin, id: el.dataset.id }); await refresh(true); toast('Play deleted'); }); },
    async 'reset-game'(el) { if (!(await ask('Delete every play and reset the game to pregame?', 'Reset game', false, true))) return; await act(el, async () => { await call('POST', '/reset', { pin: S.pin, what: 'game' }); await refresh(true); toast('Game reset', 'ok'); }); },
  };
  const CH = {
    sort(el) { S.sort = el.value; S.dirty = false; el.blur(); render(); },
    async captain(el) {
      const t = el.dataset.team; const id = el.value || null;
      await act(el, () => saveConfig((c) => { c.teams[t].captainId = id; if (id) { if (c.teams[C.other(t)].captainId === id) c.teams[C.other(t)].captainId = null; c.draft.picks = c.draft.picks.filter((k) => k.playerId !== id); } }, id ? 'Captain set' : 'Captain cleared'));
    },
    async 'draft-order'(el) { await act(el, () => saveConfig((c) => { c.draft.order = el.value; })); },
    async 'draft-first'(el) { await act(el, () => saveConfig((c) => { c.draft.first = el.value; })); },
    async 'team-name'(el) { await act(el, () => saveConfig((c) => { c.teams[el.dataset.team].name = el.value.trim().slice(0, 30); }, 'Team name saved')); },
    async 'team-color'(el) { await act(el, () => saveConfig((c) => { c.teams[el.dataset.team].color = el.value; })); },
    'join-who'(el) { $('#join-name').classList.toggle('hide', !!el.value); },
    async evq(el) { S.evq = Number(el.value); LS.set('tb-evq', S.evq); el.blur(); render(); if (game().status === 'live') await act(null, () => setGame({ quarter: S.evq })); },
    evtype(el) { S.ev.type = el.value; S.ev.playerId = ''; el.blur(); render(); },
    evplayer(el) { S.ev.playerId = el.value; },
    evteam(el) { S.ev.team = el.value; S.ev.playerId = ''; el.blur(); render(); },
  };
  function pinModal() {
    openModal(`<h3 style="font-size:20px">${S.hasCommish ? 'Commissioner sign-in' : 'Set the commissioner PIN'}</h3>
      <div class="small muted" style="margin:6px 0 14px">${S.hasCommish ? 'Enter the 4-digit PIN to unlock editing, the draft, lines and stats.' : 'Pick a 4-digit PIN. Whoever sets it first is the commissioner, so do this right after you deploy.'}</div>
      <div class="row"><input id="pin-in" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="width:120px"><button class="btn pri" data-act="pin-submit">${S.hasCommish ? 'Unlock' : 'Set PIN'}</button></div>`, true);
    setTimeout(() => $('#pin-in')?.focus(), 30);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.act]; if (fn) { fn(el, e); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
    if (e.key === 'Enter' && e.target.id === 'pin-in') A['pin-submit']($('[data-act="pin-submit"]'));
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el); });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.input === 'stake' && S.slip) { S.slip.stake = el.value; const q = C.quote(cfg(), S.slip.market, S.slip.sel, S.slip.propId); const me = ledger[S.me?.id]; const t = $('#towin'); if (t && typeof q !== 'string') t.textContent = `To win ${money(C.profit(Number(el.value) || 0, q.odds))} · available ${money(me?.available || 0)}`; }
    if (el.dataset.input === 'evpts') S.ev.pts = el.value;
    if (el.dataset.lines && S.linesDraft) {
      const parts = el.dataset.lines.split('.'); let o = S.linesDraft; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
      const k = parts[parts.length - 1]; o[k] = el.tagName === 'SELECT' ? el.value : Number(el.value);
    }
  });
  document.addEventListener('focusout', () => setTimeout(() => { const ae = document.activeElement; if (S.dirty && !(ae && ae.closest && ae.closest('#app, #slip-root') && /INPUT|SELECT|TEXTAREA/.test(ae.tagName))) render(); }, 60));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(); }, 4000);
})();
</script>
</body>
</html>
